---
# =====================================================================
# Play 0: Clean up old Prefect 2 installations
# =====================================================================
- name: Uninstall Prefect 2 components and prepare for Prefect 3
  hosts: all
  become: true
  tags: [prefect]
  pre_tasks:
    - name: Ensure pip and venv are installed
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
        state: present
        update_cache: true

    - name: Install jsondiff for Docker stack removal (manager only)
      ansible.builtin.shell: |
        python3 -m pip install jsondiff --break-system-packages || true
      args:
        executable: /bin/bash
      when: "'managers' in group_names"
      ignore_errors: true

  tasks:
    - name: Remove old Prefect stack from Swarm (if present)
      community.docker.docker_stack:
        name: prefect_stack
        state: absent
      when: "'managers' in group_names"
      ignore_errors: true

    - name: Stop and disable Prefect agent service
      ansible.builtin.systemd:
        name: prefect-agent
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Stop and disable Prefect server service
      ansible.builtin.systemd:
        name: prefect-server
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Uninstall any old Prefect packages (ignore PEP 668)
      ansible.builtin.shell: |
        python3 -m pip uninstall -y prefect --break-system-packages || true
        python3 -m pip uninstall -y prefecthq --break-system-packages || true
        python3 -m pip uninstall -y prefect2 --break-system-packages || true
        python3 -m pip uninstall -y prefect-server --break-system-packages || true
        python3 -m pip uninstall -y prefect-agent --break-system-packages || true
      args:
        executable: /bin/bash
      ignore_errors: true

    - name: Remove Prefect service and data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/prefect-agent.service
        - /etc/systemd/system/prefect-server.service
        - /opt/prefect
        - /var/lib/prefect
      ignore_errors: true

- name: Play 1 - Install Docker on all nodes
  hosts: all
  become: true
  tags: [docker, minio, prefect]
  roles:
    - role: docker

- name: Play 2 - Create MinIO data directory on all nodes
  hosts: all
  become: true
  tags: [minio]
  tasks:
    - name: Create local MinIO data directory
      ansible.builtin.file:
        path: /mnt/minio/data
        state: directory
        mode: '0755'

- name: Play 3 - Initialize Swarm on the manager node
  hosts: managers
  become: true
  tags: [swarm, minio, prefect]
  roles:
    - role: swarm_manager
# =====================================================================
# Play 3.2 - Ensure workers rejoin the Swarm and ai-net overlay network exists
# =====================================================================
- name: Ensure all nodes are joined to the Swarm and ai-net exists
  hosts: managers
  become: true
  tags: [swarm, network, join]
  tasks:

    # Get join token from the current manager
    - name: Get Docker Swarm join token for workers
      ansible.builtin.command: docker swarm join-token -q worker
      register: swarm_worker_token
      changed_when: false

    - name: Show token for debugging
      ansible.builtin.debug:
        msg: "Worker join token: {{ swarm_worker_token.stdout }}"

    # Distribute and rejoin all workers dynamically
    - name: Rejoin all worker nodes to the Swarm
      delegate_to: "{{ item }}"
      become: true
      ansible.builtin.shell: |
        docker swarm leave --force || true
        docker swarm join --token {{ swarm_worker_token.stdout }} {{ hostvars[inventory_hostname].ansible_host }}:2377 || true
      loop: "{{ groups['workers'] }}"
      ignore_errors: true
      args:
        executable: /bin/bash

# =====================================================================
# Play 3.5 - Distribute manager's SSH key to all workers
# =====================================================================
- name: Distribute manager's SSH key to all workers
  hosts: managers
  become: true
  tags: [ssh]
  tasks:
    - name: Ensure manager has SSH key pair
      ansible.builtin.openssh_keypair:
        path: /home/ubuntu/.ssh/id_rsa
        owner: ubuntu
        group: ubuntu
        type: rsa
        size: 4096
        mode: '0600'
      become_user: ubuntu

    - name: Read manager's public key
      ansible.builtin.slurp:
        src: /home/ubuntu/.ssh/id_rsa.pub
      register: manager_pubkey

    - name: Add manager's public key to all workers' authorized_keys
      delegate_to: "{{ item }}"
      ansible.builtin.authorized_key:
        user: ubuntu
        key: "{{ manager_pubkey['content'] | b64decode }}"
      loop: "{{ groups['workers'] }}"

- name: Play 4 - Join workers to the Swarm
  hosts: workers
  become: true
  tags: [swarm, minio, prefect]
  roles:
    - role: swarm_worker

- name: Play 5 - Deploy application stacks on the manager
  hosts: managers
  become: true
  tags: [minio, prefect]
  roles:
    - role: stack_deploy

- name: Play 6 - Deploy Monitoring Stack
  hosts: managers
  become: true
  tags: [monitoring]
  tasks:
    - name: Ensure monitoring stack is stopped
      community.docker.docker_stack:
        name: monitoring_stack
        state: absent
      ignore_errors: true

    - name: Prune Grafana volume for a clean deployment
      community.docker.docker_volume:
        name: monitoring_stack_grafana-data
        state: absent
      ignore_errors: true

    - name: Copy monitoring configuration files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/tmp/{{ item.dest }}"
      loop:
        - { src: 'templates/prometheus.yml.j2', dest: 'prometheus.yml' }
        - { src: 'templates/grafana-datasources.yml.j2', dest: 'grafana-datasources.yml' }
        - { src: 'templates/grafana-dashboards.yml.j2', dest: 'grafana-dashboards.yml' }
        - { src: 'templates/docker-swarm-dashboard.json.j2', dest: 'docker-swarm-dashboard.json' }

    - name: Copy monitoring stack compose file
      ansible.builtin.copy:
        src: monitoring-stack.yml
        dest: /tmp/monitoring-stack.yml

    - name: Deploy the monitoring stack
      community.docker.docker_stack:
        name: monitoring_stack
        state: present
        compose:
          - /tmp/monitoring-stack.yml
    - name: Wait for Grafana service to be healthy
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 3000
        delay: 10
        timeout: 60

    - name: Ensure Prometheus datasource exists in Grafana
      uri:
        url: "http://localhost:3000/api/datasources"
        method: POST
        user: admin
        password: grafana
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "Prometheus"
          type: "prometheus"
          access: "proxy"
          url: "http://prometheus:9090"
          isDefault: true
        status_code: [200, 409]
      register: datasource_response
      retries: 3
      delay: 5
      until: datasource_response.status == 200 or datasource_response.status == 409

    - name: Log datasource creation result
      debug:
        msg: "Prometheus datasource creation status: {{ datasource_response.status }}"


# =====================================================================
# Play 6: Distribute custom image
# =====================================================================
- name: Play 6 - Push Datafusion API image tarball to workers
  hosts: managers
  become: true
  tags: ["datafusion"]
  tasks:
    - name: Copy tarball to all workers
      become_user: ubuntu
      ansible.builtin.shell: |
        {% for worker in groups['workers'] %}
        echo "Copying to {{ hostvars[worker].ansible_host }}...";
        scp -i /home/ubuntu/.ssh/id_rsa -o StrictHostKeyChecking=no /tmp/datafusion_api_server.tar.gz ubuntu@{{ hostvars[worker].ansible_host }}:/home/ubuntu/datafusion_api_server.tar.gz;
        {% endfor %}
      args:
        executable: /bin/bash

- name: Play 7 - Load Datafusion API image tarball into Docker
  hosts: all
  become: true
  tags: ["datafusion", "docker-image"]
  tasks:
    - name: Ensure tarball exists
      ansible.builtin.stat:
        path: /home/ubuntu/datafusion_api_server.tar.gz
      register: image_tar

    - name: Load Docker image from tarball
      ansible.builtin.shell: |
        echo "Loading Datafusion API Docker image..."
        docker load -i /home/ubuntu/datafusion_api_server.tar.gz
      args:
        executable: /bin/bash
      when: image_tar.stat.exists