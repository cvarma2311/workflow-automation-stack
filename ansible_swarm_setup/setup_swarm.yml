# =====================================================================
# Play 0: Clean up old Prefect 2 installations
# =====================================================================
- name: Uninstall Prefect 2 components and prepare for Prefect 3
  hosts: all
  become: true
  tags: [prefect]
  pre_tasks:
    - name: Ensure pip and venv are installed
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
        state: present
        update_cache: true

    - name: Install jsondiff for Docker stack removal (manager only)
      ansible.builtin.shell: |
        python3 -m pip install jsondiff --break-system-packages || true
      args:
        executable: /bin/bash
      when: "'managers' in group_names"
      ignore_errors: true

  tasks:
    - name: Remove old Prefect stack from Swarm (if present)
      community.docker.docker_stack:
        name: prefect_stack
        state: absent
      when: "'managers' in group_names"
      ignore_errors: true

    - name: Stop and disable Prefect agent service
      ansible.builtin.systemd:
        name: prefect-agent
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Stop and disable Prefect server service
      ansible.builtin.systemd:
        name: prefect-server
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Uninstall any old Prefect packages (ignore PEP 668)
      ansible.builtin.shell: |
        python3 -m pip uninstall -y prefect --break-system-packages || true
        python3 -m pip uninstall -y prefecthq --break-system-packages || true
        python3 -m pip uninstall -y prefect2 --break-system-packages || true
        python3 -m pip uninstall -y prefect-server --break-system-packages || true
        python3 -m pip uninstall -y prefect-agent --break-system-packages || true
      args:
        executable: /bin/bash
      ignore_errors: true

    - name: Remove Prefect service and data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/prefect-agent.service
        - /etc/systemd/system/prefect-server.service
        - /opt/prefect
        - /var/lib/prefect
      ignore_errors: true

# =====================================================================
# Play 1: Install Docker on all nodes
# =====================================================================
- name: Play 1 - Install Docker on all nodes
  hosts: all
  become: true
  tags: [docker, minio, prefect]
  roles:
    - role: docker

# =====================================================================
# Play 1.5: Configure SSH access to GitHub on all nodes
# =====================================================================
- name: Setup SSH keys for GitHub on all cluster nodes
  hosts: all
  become: true
  tags: [ssh, github]
  tasks:
    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: /home/ubuntu/.ssh
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0700'

    - name: Generate SSH keypair for GitHub access (if not present)
      ansible.builtin.openssh_keypair:
        path: /home/ubuntu/.ssh/id_ed25519
        type: ed25519
        comment: "ec2-deploy@urdhva"
        owner: ubuntu
        group: ubuntu
        mode: '0600'
        state: present
      become_user: ubuntu

    - name: Fetch public SSH key from each node
      ansible.builtin.slurp:
        src: /home/ubuntu/.ssh/id_ed25519.pub
      register: github_keys

    - name: Display the public key(s) to register in GitHub Deploy Keys
      ansible.builtin.debug:
        msg: |
          === ADD THIS PUBLIC KEY TO GITHUB ===
          {{ item.key }}:
          {{ item.value['content'] | b64decode }}
      loop: "{{ github_keys.results | dict2items }}"
      run_once: true

    - name: Add GitHub to known_hosts to avoid SSH prompts
      ansible.builtin.shell: |
        ssh-keyscan github.com >> /home/ubuntu/.ssh/known_hosts
      args:
        creates: /home/ubuntu/.ssh/known_hosts
      become_user: ubuntu

    - name: Fix SSH key permissions
      ansible.builtin.file:
        path: /home/ubuntu/.ssh/id_ed25519
        mode: '0600'
        owner: ubuntu
        group: ubuntu

    - name: Fix public key permissions
      ansible.builtin.file:
        path: /home/ubuntu/.ssh/id_ed25519.pub
        mode: '0644'
        owner: ubuntu
        group: ubuntu

# =====================================================================
# Play 2: Create MinIO data directory
# =====================================================================
- name: Play 2 - Create MinIO data directory on all nodes
  hosts: all
  become: true
  tags: [minio]
  tasks:
    - name: Create local MinIO data directory
      ansible.builtin.file:
        path: /mnt/minio/data
        state: directory
        mode: '0755'

# =====================================================================
# Play 2.5: Clone urdhva_base framework into /opt
# =====================================================================
- name: Play 2.5 - Pull urdhva_base backend framework into /opt
  hosts: all
  become: true
  tags: [urdhva_base, prefect]
  tasks:
    - name: Ensure git is installed
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: yes

    - name: Create destination directory
      ansible.builtin.file:
        path: /opt/urdhva_base
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Pull urdhva_base repository
      ansible.builtin.git:
        repo: "https://github.com/urdhvapay/pipeline_backend_v1"
        dest: /opt/urdhva_base
        version: pipeline_dev
        force: yes
        key_file: /home/ubuntu/.ssh/id_ed25519

    - name: Show result
      ansible.builtin.debug:
        msg: "pipeline_backend_v1 repository is ready at /opt/urdhva_base"

# =====================================================================
# Play 3: Initialize Swarm on manager node
# =====================================================================
- name: Play 3 - Initialize Swarm on the manager node
  hosts: managers
  become: true
  tags: [swarm, minio, prefect]
  roles:
    - role: swarm_manager

# =====================================================================
# Play 4: Join workers to the Swarm
# =====================================================================
- name: Play 4 - Join workers to the Swarm
  hosts: workers
  become: true
  tags: [swarm, minio, prefect]
  roles:
    - role: swarm_worker

# =====================================================================
# Play 5: Deploy application stacks on manager
# =====================================================================
- name: Play 5 - Deploy application stacks on the manager
  hosts: managers
  become: true
  tags: [minio, prefect]
  roles:
    - role: stack_deploy