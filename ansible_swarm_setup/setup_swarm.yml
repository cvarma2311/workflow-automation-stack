---
# =====================================================================
# Play 0: Clean up old Prefect 2 installations
# =====================================================================
- name: Uninstall Prefect 2 components and prepare for Prefect 3
  hosts: all
  become: true
  tags: [prefect]
  pre_tasks:
    - name: Ensure pip and venv are installed
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
        state: present
        update_cache: true

    - name: Install jsondiff for Docker stack removal (manager only)
      ansible.builtin.shell: |
        python3 -m pip install jsondiff --break-system-packages || true
      args:
        executable: /bin/bash
      when: "'managers' in group_names"
      ignore_errors: true

  tasks:
    - name: Remove old Prefect stack from Swarm (if present)
      community.docker.docker_stack:
        name: prefect_stack
        state: absent
      when: "'managers' in group_names"
      ignore_errors: true

    - name: Stop and disable Prefect agent service
      ansible.builtin.systemd:
        name: prefect-agent
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Stop and disable Prefect server service
      ansible.builtin.systemd:
        name: prefect-server
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Uninstall any old Prefect packages (ignore PEP 668)
      ansible.builtin.shell: |
        python3 -m pip uninstall -y prefect --break-system-packages || true
        python3 -m pip uninstall -y prefecthq --break-system-packages || true
        python3 -m pip uninstall -y prefect2 --break-system-packages || true
        python3 -m pip uninstall -y prefect-server --break-system-packages || true
        python3 -m pip uninstall -y prefect-agent --break-system-packages || true
      args:
        executable: /bin/bash
      ignore_errors: true

    - name: Remove Prefect service and data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/prefect-agent.service
        - /etc/systemd/system/prefect-server.service
        - /opt/prefect
        - /var/lib/prefect
      ignore_errors: true

- name: Play 1 - Install Docker on all nodes
  hosts: all
  become: true
  tags: [docker, minio, prefect]
  roles:
    - role: docker

- name: Play 2 - Create MinIO data directory on all nodes
  hosts: all
  become: true
  tags: [minio]
  tasks:
    - name: Create local MinIO data directory
      ansible.builtin.file:
        path: /mnt/minio/data
        state: directory
        mode: '0755'

- name: Play 3 - Initialize Swarm on the manager node
  hosts: managers
  become: true
  tags: [swarm, minio, prefect]
  roles:
    - role: swarm_manager

# =====================================================================
# Play 3.5 - Distribute manager's SSH key to all workers
# =====================================================================
- name: Distribute manager's SSH key to all workers
  hosts: managers
  become: true
  tags: [ssh]
  tasks:
    - name: Ensure manager has SSH key pair
      ansible.builtin.openssh_keypair:
        path: /home/ubuntu/.ssh/id_rsa
        owner: ubuntu
        group: ubuntu
        type: rsa
        size: 4096
        mode: '0600'
      become_user: ubuntu

    - name: Read manager's public key
      ansible.builtin.slurp:
        src: /home/ubuntu/.ssh/id_rsa.pub
      register: manager_pubkey

    - name: Add manager's public key to all workers' authorized_keys
      delegate_to: "{{ item }}"
      ansible.builtin.authorized_key:
        user: ubuntu
        key: "{{ manager_pubkey['content'] | b64decode }}"
      loop: "{{ groups['workers'] }}"

- name: Play 4 - Join workers to the Swarm
  hosts: workers
  become: true
  tags: [swarm, minio, prefect]
  roles:
    - role: swarm_worker

- name: Play 5 - Deploy application stacks on the manager
  hosts: managers
  become: true
  tags: [minio, prefect]
  roles:
    - role: stack_deploy

# =====================================================================
# Play 6: Distribute custom image
# =====================================================================
- name: Play 6 - Push Datafusion API image tarball to workers
  hosts: managers
  become: true
  tags: ["datafusion"]
  tasks:
    - name: Copy tarball to all workers
      become_user: ubuntu
      ansible.builtin.shell: |
        {% for worker in groups['workers'] %}
        echo "Copying to {{ hostvars[worker].ansible_host }}...";
        scp -i /home/ubuntu/.ssh/id_rsa -o StrictHostKeyChecking=no /tmp/datafusion_api_server.tar.gz ubuntu@{{ hostvars[worker].ansible_host }}:/tmp/datafusion_api_server.tar.gz;
        {% endfor %}
      args:
        executable: /bin/bash

- name: Play 7 - Load Datafusion API image tarball into Docker
  hosts: all
  become: true
  tags: ["datafusion", "docker-image"]
  tasks:
    - name: Ensure tarball exists
      ansible.builtin.stat:
        path: /tmp/datafusion_api_server.tar.gz
      register: image_tar

    - name: Load Docker image from tarball
      ansible.builtin.shell: |
        echo "Loading Datafusion API Docker image..."
        docker load -i /tmp/datafusion_api_server.tar.gz
      args:
        executable: /bin/bash
      when: image_tar.stat.exists