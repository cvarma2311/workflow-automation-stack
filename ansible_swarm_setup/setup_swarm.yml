---
- name: Play 1 - Install Docker on all nodes
  hosts: all
  become: true
  roles:
    - role: docker

- name: Play 2 - Initialize Swarm on the manager node
  hosts: managers
  become: true
  roles:
    - role: swarm_manager

- name: Play 3 - Join workers to the Swarm
  hosts: workers
  become: true
  roles:
    - role: swarm_worker

- name: Play 4 - Deploy application stacks on the manager
  hosts: managers
  become: true
  roles:
    - role: stack_deploy

- name: Play 5 - Install InfluxDB on the manager
  hosts: managers
  become: false
  roles:
    - role: influxdb_manager

- name: Play 6 - Print deployment summary and connection details
  hosts: managers
  become: false
  roles:
    - role: deployment_summary
