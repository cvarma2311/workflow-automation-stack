version: '3.7'

networks:
  monitoring:
    driver: overlay

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

configs:
  promtail-config:
    external: true
  loki-config:
    external: true

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    volumes:
      - prometheus-data:/prometheus
      - /tmp/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  loki:
    image: grafana/loki:2.9.2
    ports:
      - "3100:3100"
    configs:
      - source: loki-config
        target: /etc/loki/config.yml
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  promtail:
    image: grafana/promtail:2.9.2
    configs:
      - source: promtail-config
        target: /etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    ports:
      - "8081:8080"
    hostname: '{{.Node.Hostname}}'
    command:
      - "--docker=tcp://ip-172-31-9-234:2375"  # 👈 Update with your manager private IP
      - "--housekeeping_interval=30s"
      - "--global_housekeeping_interval=30s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--disable_metrics=percpu,sched,process"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  node-exporter:
    image: prom/node-exporter:v1.6.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:10.1.1
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - /tmp/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - /tmp/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - /tmp/docker-swarm-dashboard.json:/var/lib/grafana/dashboards/docker-swarm-dashboard.json
      - /tmp/grafana-loki-dashboard.json:/var/lib/grafana/dashboards/grafana-loki-dashboard.json
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    networks:
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  docker-api-check:
    image: curlimages/curl:8.5.0
    command: ["curl", "-s", "http://ip-172-31-9-234:2375/version"]
    networks:
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure