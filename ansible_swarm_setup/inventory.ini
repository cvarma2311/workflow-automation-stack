# This is the inventory file for the Docker Swarm setup.
# Please replace the placeholder IPs with the actual IP addresses of your VMs.

[managers]
# This group should contain one manager node.
manager-1 ansible_host=192.168.1.100

[workers]
# This group can contain one or more worker nodes.
worker-1 ansible_host=192.168.1.101
# worker-2 ansible_host=192.168.1.102

[storage]
# This group should contain the node where MinIO data will be stored.
# It can be the manager or one of the workers.
manager-1 ansible_host=192.168.1.100

[all:vars]
# Define the user for SSH connections. Replace 'ubuntu' if your user is different.
ansible_user=ubuntu
# Uncomment and set the path to your private key if you are not using the default ~/.ssh/id_rsa
# ansible_ssh_private_key_file=~/.ssh/your_private_key
