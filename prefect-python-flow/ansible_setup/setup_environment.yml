---
- name: Setup Environment for Pure Python Prefect Flow
  hosts: local
  # removed become: yes as Homebrew does not support running as root
  tasks:
    - name: Update package cache (for Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == "Debian"
      become: yes # Use become only for tasks that need it

    - name: Install Python Pip (for Debian/Ubuntu)
      ansible.builtin.apt:
        name: python3-pip
        state: present
      when: ansible_os_family == "Debian"
      become: yes

    - name: Install Python Pip (for RedHat/CentOS)
      ansible.builtin.yum:
        name: python3-pip
        state: present
      when: ansible_os_family == "RedHat"
      become: yes

    - name: Install Python (for macOS)
      community.general.homebrew:
        name: python3
        state: present
      when: ansible_os_family == "Darwin"

    - name: Ensure pip is up to date
      ansible.builtin.pip:
        name: pip
        state: latest
        executable: pip3
      # No become for pip installs unless targeting system-wide.
      # Assuming user's .venv is active or targetting user-site.

    - name: Install required Python packages
      ansible.builtin.pip:
        name:
          - prefect==3.4.19
          - psutil
          - polars
          - pyarrow
        executable: pip3
      # No become for pip installs unless targeting system-wide.
